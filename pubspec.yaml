name: onam_pass
description: "Onam Pass - Student entry pass management for college Onam event."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase backend
  supabase_flutter: ^2.17.2

  # QR code generation
  qr_flutter: ^4.1.0

  # QR / barcode scanner
  mobile_scanner: ^6.0.0

  # Save pass as image
  screenshot: ^3.0.0

  # Share pass image / file
  share_plus: ^10.0.0

  # File system paths
  path_provider: ^2.1.5

  # Google Fonts (Outfit, Poppins)
  google_fonts: ^6.2.1

  # Date/time formatting
  intl: ^0.19.0

  # Internet connectivity detection
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
